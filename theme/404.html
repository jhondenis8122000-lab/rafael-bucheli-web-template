<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Página no encontrada - UE Rafael Bucheli</title>
    <meta name="description" content="La página solicitada no está disponible. Regresa al sitio oficial de la Unidad Educativa Rafael Bucheli.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://rafaelbucheli.com/404">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/png" href="assets/images/icon/logo.png">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome.min.css">
    <style>
        :root {
            --primary-blue: #252855;
            --accent: #f5a000;
            --muted: #5d6473;
            --surface: #ffffff;
            --soft: #f6f8fc;
            --border: rgba(37, 40, 85, 0.12);
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            background: radial-gradient(circle at top left, rgba(245,160,0,0.14), transparent 34%), linear-gradient(135deg, #ffffff, var(--soft));
            color: var(--primary-blue);
            font-family: Arial, sans-serif;
        }
        .not-found {
            width: min(960px, calc(100% - 28px));
            margin: 0 auto;
            padding: 44px;
            border: 1px solid var(--border);
            border-radius: 26px;
            background: rgba(255,255,255,0.94);
            box-shadow: 0 30px 80px rgba(37,40,85,0.13);
            text-align: center;
        }
        .logo {
            max-width: 132px;
            margin-bottom: 24px;
        }
        .error-code {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(37,40,85,0.07);
            color: var(--primary-blue);
            font-weight: 700;
        }
        h1 {
            margin: 0 0 14px;
            color: var(--primary-blue);
            font-size: clamp(34px, 6vw, 58px);
            line-height: 1.05;
        }
        p {
            max-width: 650px;
            margin: 0 auto 18px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.6;
        }
        .requested-url {
            display: inline-block;
            max-width: 100%;
            margin: 10px auto 28px;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--soft);
            color: var(--muted);
            font-size: 14px;
            overflow-wrap: anywhere;
        }
        .actions,
        .quick-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .actions { margin-bottom: 28px; }
        .btn-home,
        .btn-outline,
        .quick-links a {
            min-width: 160px;
            padding: 13px 20px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-home {
            background: var(--primary-blue);
            color: #fff;
            box-shadow: 0 15px 30px rgba(37,40,85,0.22);
        }
        .btn-outline {
            border: 1px solid var(--border);
            color: var(--primary-blue);
            background: #fff;
        }
        .quick-links a {
            min-width: auto;
            padding: 10px 16px;
            background: rgba(245,160,0,0.12);
            color: var(--primary-blue);
        }
        a:hover,
        a:focus {
            transform: translateY(-2px);
            text-decoration: none;
        }
        @media (max-width: 576px) {
            .not-found { padding: 30px 18px; }
            .btn-home,
            .btn-outline { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="not-found" aria-labelledby="notFoundTitle">
        <img class="logo" src="assets/images/icon/logo.png" alt="Unidad Educativa Rafael Bucheli" decoding="async">
        <div class="error-code"><i class="fa fa-compass" aria-hidden="true"></i> Error 404</div>
        <h1 id="notFoundTitle">No encontramos este enlace</h1>
        <p>La página solicitada no existe, fue movida o el enlace está escrito de forma incorrecta. Puede volver al inicio y continuar navegando con normalidad.</p>
        <div class="requested-url" id="requestedUrl">Enlace solicitado no disponible</div>
        <div class="actions">
            <a class="btn-home" href="/"><i class="fa fa-home" aria-hidden="true"></i> Volver al inicio</a>
            <a class="btn-outline" href="/contacto"><i class="fa fa-envelope" aria-hidden="true"></i> Contactar</a>
        </div>
        <nav class="quick-links" aria-label="Enlaces útiles">
            <a href="/admisiones">Admisiones</a>
            <a href="/oferta-academica">Oferta académica</a>
            <a href="/servicios">Servicios</a>
        </nav>
    </main>
    <script>
        (function () {
            var currentPath = window.location.pathname.replace(/^\/+/, '') || 'inicio';
            var requestedUrl = document.getElementById('requestedUrl');
            if (requestedUrl) {
                requestedUrl.textContent = 'Enlace solicitado: /' + currentPath;
            }
        })();
    </script>
</body>
</html>
